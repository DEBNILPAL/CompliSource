services:
  - type: web
    name: complisource-api
    env: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /docs
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.5
      # Add real blockchain/API keys here if needed
      # - key: SOME_API_KEY
      #   sync: false
